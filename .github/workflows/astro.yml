name: Deploy Astro site to GitHub Pages

# A push to main builds and deploys. A pull request into main only checks
# and builds, so a branch is tested before it is merged.
#
# The site also rebuilds every night, because what it shows depends on the
# date it was built: "Apply now" turns into "Tell me when it opens" on the
# first build after a round closes (src/data/recruitment.ts). 03:30 UTC is
# 05:30 in Valencia in summer and 04:30 in winter. GitHub runs schedules only
# on main, and pauses them after 60 days without a commit to the repository;
# a commit or "Enable workflow" in the Actions tab turns them back on.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check types and content
        run: npm run check

      - name: Build
        run: npm run build

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
