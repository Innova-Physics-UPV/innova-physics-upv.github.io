body:
  en: "This semester we build the cathode power supply and the control of the vacuum system: the bench where ALOHA-0 will be tested. We aim to end the season with a working vacuum bench and, with our sponsors, a stable measured beam."
  es: "Este cuatrimestre construimos la fuente de alimentación del cátodo y el control del sistema de vacío: el banco donde se probará ALOHA-0. Aspiramos a acabar la temporada con un banco de vacío que funcione y, con nuestros patrocinadores, un haz estable y medido."
  va: "Este quadrimestre construïm la font d’alimentació del càtode i el control del sistema de buit: el banc on es provarà ALOHA-0. Aspirem a acabar la temporada amb un banc de buit que funcione i, amb els nostres patrocinadors, un feix estable i mesurat."
