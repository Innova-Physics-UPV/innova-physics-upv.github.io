    en: "The source, then four buncher and four accelerating cavities, outlined: not built yet."
    es: "La fuente y, después, cuatro cavidades del agrupador y cuatro aceleradoras, en contorno: aún sin construir."
    va: "La font i, després, quatre cavitats de l’agrupador i quatre acceleradores, en contorn: encara sense construir."
