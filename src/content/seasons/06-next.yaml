title:
  en: "A beam that reads paintings"
  es: "Un haz que lee cuadros"
  va: "Un feix que llig quadres"
body:
  en: "Next, ALOHA-0 becomes the source of an X-ray instrument for conservation: its beam makes X-rays, and each pigment in a painting answers with its own lines, read without taking a sample. The 20 keV ceiling protects the paintings."
  es: "Después, ALOHA-0 pasa a ser la fuente de un instrumento de rayos X para la conservación: su haz produce rayos X y cada pigmento de un cuadro responde con sus propias líneas, que se leen sin tomar ninguna muestra. El límite de 20 keV protege los cuadros."
  va: "Després, ALOHA-0 passa a ser la font d’un instrument de raigs X per a la conservació: el seu feix produïx raigs X i cada pigment d’un quadre respon amb les seues pròpies línies, que es lligen sense prendre cap mostra. El límit de 20 keV protegix els quadres."
