body:
  en: "After the source, a buncher and an accelerating structure at 2.998 GHz, designed to bring the beam to 1 MeV. It is still on paper: we aim to finish the design by the end of the season, and then to put the beam to work."
  es: "Tras la fuente, un agrupador y una estructura aceleradora a 2.998 GHz, diseñados para llevar el haz a 1 MeV. Todavía está sobre el papel: aspiramos a terminar el diseño al final de la temporada y, después, a poner el haz a trabajar."
  va: "Després de la font, un agrupador i una estructura acceleradora a 2.998 GHz, dissenyats per a portar el feix a 1 MeV. Encara està sobre el paper: aspirem a acabar el disseny al final de la temporada i, després, a posar el feix a treballar."
