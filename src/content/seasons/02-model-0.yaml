# [SEASON]: the season of Model-0 is still to come from the team.
season: "[SEASON] · MODEL-0"
title:
  en: "A beam you can see"
  es: "Un haz que se puede ver"
  va: "Un feix que es pot veure"
body:
  en: "Our first device is a demonstrator for science communication: a glass bottle, a vacuum pump and a high-voltage supply. At about 1 Torr the gas glows along the path of the electrons. It brought Edwards Vacuum on board as our first sponsor."
  es: "Nuestro primer dispositivo es un demostrador para divulgación científica: una botella de vidrio, una bomba de vacío y una fuente de alta tensión. A cerca de 1 Torr, el gas brilla a lo largo del camino de los electrones. Gracias a él, Edwards Vacuum se unió como nuestro primer patrocinador."
  va: "El nostre primer dispositiu és un demostrador per a divulgació científica: una botella de vidre, una bomba de buit i una font d’alta tensió. A prop d’1 Torr, el gas brilla al llarg del camí dels electrons. Gràcies a ell, Edwards Vacuum es va unir com el nostre primer patrocinador."
marker: solid
