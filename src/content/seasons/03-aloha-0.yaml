title:
  en: "The electron source, simulated"
  es: "La fuente de electrones, simulada"
  va: "La font d’electrons, simulada"
body:
  en: "Our first accelerator starts where every accelerator starts: a thermionic triode in telefocus configuration. A hot tungsten cathode emits, a Wehnelt cylinder shapes the emission, and an anode 30 kV above the cathode pulls the beam out."
  es: "Nuestro primer acelerador empieza donde empiezan todos: un triodo termoiónico en configuración telefocus. Un cátodo de wolframio caliente emite, un cilindro de Wehnelt da forma a la emisión y un ánodo a 30 kV por encima del cátodo extrae el haz."
  va: "El nostre primer accelerador comença on comencen tots: un tríode termoiònic en configuració telefocus. Un càtode de wolframi calent emet, un cilindre de Wehnelt dona forma a l’emissió i un ànode a 30 kV per damunt del càtode extrau el feix."
marker: hatched
