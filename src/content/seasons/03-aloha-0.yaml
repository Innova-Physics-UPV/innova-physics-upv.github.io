    es: "La fuente, en sección."
    va: "La font, en secció."
  text:
    en: "Cathode, Wehnelt and anode hatched: simulated. The einzel lens outlined: planned."
    es: "Cátodo, Wehnelt y ánodo rayados: simulados. La lente einzel en contorno: prevista."
    va: "Càtode, Wehnelt i ànode ratllats: simulats. La lent einzel en contorn: prevista."
