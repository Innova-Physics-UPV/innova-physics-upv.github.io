title:
  en: "Our posters at CERN"
  es: "Nuestros pósteres en el CERN"
  va: "Els nostres pòsters al CERN"
body:
  en: "We took ALOHA to CERN, with Model-0 and the first design of our electron source, on two posters: one on our case for teaching accelerators by building them, one on the source. We presented them at the accelECR poster session for early-career researchers, and visited IdeaSquare."
  es: "Llevamos ALOHA al CERN, con Model-0 y el primer diseño de nuestra fuente de electrones, en dos pósteres: uno sobre por qué enseñar aceleradores construyéndolos y otro sobre la fuente. Los presentamos en la sesión de pósteres accelECR, para investigadores que empiezan su carrera, y visitamos IdeaSquare."
  va: "Vam portar ALOHA al CERN, amb Model-0 i el primer disseny de la nostra font d’electrons, en dos pòsters: un sobre per què cal ensenyar acceleradors construint-los i un altre sobre la font. Els vam presentar a la sessió de pòsters accelECR, per a investigadors que comencen la seua carrera, i vam visitar IdeaSquare."
